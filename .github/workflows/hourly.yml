name: Hourly politics card news

on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분 (UTC 기준이지만 매시간이라 무관)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Threads에 올리지 않고 카드만 생성"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hourly-card-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      ACCOUNT_HANDLE: ${{ vars.ACCOUNT_HANDLE || '@politics_hourly' }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
      ASSETS_BRANCH: assets
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt

      - name: Restore state from assets branch
        run: |
          mkdir -p assets
          if git fetch --depth=1 origin "$ASSETS_BRANCH" 2>/dev/null; then
            git show FETCH_HEAD:state.json > assets/state.json 2>/dev/null || rm -f assets/state.json
          fi

      - name: Build card news
        id: build
        run: python -m cardnews build --state-dir assets --out "assets/cards/$(date +%Y%m%d-%H%M)"

      - name: Publish images to assets branch
        if: steps.build.outputs.post_dir != ''
        run: ./scripts/push_assets.sh "cards: ${{ steps.build.outputs.post_dir }}"

      - name: Post to Threads
        if: steps.build.outputs.post_dir != ''
        run: |
          DIR="${{ steps.build.outputs.post_dir }}"
          BASE_URL="${IMAGE_BASE_URL:-https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ASSETS_BRANCH}}/${DIR#assets/}"
          python -m cardnews post --state-dir assets --dir "$DIR" --base-url "$BASE_URL" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}

      - name: Save state
        if: steps.build.outputs.post_dir != '' && !inputs.dry_run
        run: ./scripts/push_assets.sh "state: ${{ steps.build.outputs.post_dir }}"

      - name: Upload cards as artifact
        if: steps.build.outputs.post_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: ${{ steps.build.outputs.post_dir }}
