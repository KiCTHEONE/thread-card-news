name: Politics card news

# 30분마다 외부 알람(cron-job.org)이 workflow_dispatch로 실행한다.
# GitHub 자체 schedule은 이 저장소에서 실행되지 않아 쓰지 않는다 (둘 다 쓰면 중복 게시 위험).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Threads에 올리지 않고 카드만 생성"
        type: boolean
        default: false
      lookback_minutes:
        description: "몇 분 전 기사까지 모을지 (비우면 설정값)"
        type: string
        default: ""
      ignore_seen:
        description: "이미 올린 기사도 다시 사용 (dry run 테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: card-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      ACCOUNT_HANDLE: ${{ vars.ACCOUNT_HANDLE || '@koreacardnews' }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
      IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
      ASSETS_BRANCH: assets
      LOOKBACK_MINUTES: ${{ inputs.lookback_minutes || '90' }}
      LOOKBACK_MINUTES_OVERRIDE: ${{ inputs.lookback_minutes }}
      IGNORE_SEEN: ${{ inputs.dry_run && inputs.ignore_seen }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore state from assets branch
        run: |
          mkdir -p assets
          if git fetch --depth=1 origin "$ASSETS_BRANCH" 2>/dev/null; then
            git show FETCH_HEAD:state.json > assets/state.json 2>/dev/null || rm -f assets/state.json
            git show FETCH_HEAD:token.json > assets/token.json 2>/dev/null || rm -f assets/token.json
          fi

      - name: Refresh Threads token
        id: token
        if: ${{ !inputs.dry_run }}
        run: python -m cardnews refresh-token --state-dir assets

      - name: Build card news
        id: build
        run: python -m cardnews build --state-dir assets --out "assets/cards/$(date +%Y%m%d-%H%M)"

      - name: Publish images to assets branch
        if: steps.build.outputs.post_dir != '' && env.IMGBB_API_KEY == '' && vars.IMAGE_BASE_URL == ''
        run: ./scripts/push_assets.sh "Add cards ${{ steps.build.outputs.post_dir }}"

      - name: Post to Threads
        if: steps.build.outputs.post_dir != ''
        run: |
          DIR="${{ steps.build.outputs.post_dir }}"
          # 이미지 주소: IMAGE_BASE_URL > ImgBB(IMGBB_API_KEY) > public 저장소의 assets 브랜치 raw URL
          BASE_URL="${IMAGE_BASE_URL:-}"
          if [ -z "$BASE_URL" ] && [ -z "$IMGBB_API_KEY" ]; then
            BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ASSETS_BRANCH}/${DIR#assets/}"
          fi
          python -m cardnews post --state-dir assets --dir "$DIR" --base-url "$BASE_URL" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}

      - name: Save state
        if: always() && ((steps.build.outputs.post_dir != '' && !inputs.dry_run) || steps.token.outputs.changed == 'true')
        run: ./scripts/push_assets.sh "Update state ${{ steps.build.outputs.post_dir }}"

      - name: Upload cards as artifact
        if: always() && steps.build.outputs.post_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: ${{ steps.build.outputs.post_dir }}
